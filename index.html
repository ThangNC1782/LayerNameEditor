<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;
            padding: 16px;
            background: #252525;
            color: #ddd;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        h2 {
            margin: 0 0 16px 0;
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: #444;
            color: white;
            border: 1px solid #666;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #status {
            margin-top: 10px;
            padding: 8px;
            background: #1d1d1d;
            border-radius: 3px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>Layer Name Editor</h2>

<button id="getLayers">
    GET DOCUMENT
</button>

<div id="status">
    Waiting...
</div>


<script>

const status = document.getElementById("status");

document.getElementById("getLayers").onclick = function () {

    status.textContent = "Requesting document name...";

    window.parent.postMessage(
        'app.echoToOE(app.activeDocument ? app.activeDocument.name : "NO DOCUMENT")',
        "*"
    );
};


window.addEventListener("message", function (event) {

    console.log("MESSAGE:", event.data);

    if (event.data === "done") {
        return;
    }

    status.textContent =
        "Received:\n\n" +
        event.data;

});

</script>

</body>
</html>
