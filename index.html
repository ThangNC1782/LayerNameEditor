<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;
            padding: 16px;
            background: #252525;
            color: #ddd;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        h2 {
            margin: 0 0 16px 0;
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: #444;
            color: white;
            border: 1px solid #666;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #status {
            margin-top: 10px;
            padding: 8px;
            background: #1d1d1d;
            border-radius: 3px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>Layer Name Editor</h2>

<button id="getLayers">
    GET DOCUMENT
</button>

<div id="status">
    Waiting...
</div>


<script>

const status = document.getElementById("status");

document.getElementById("getLayers").onclick = function () {

    status.textContent = "Requesting document...";

    const script = `
        (function () {

            if (!app.documents.length) {
                app.echoToOE(JSON.stringify({
                    error: "NO_DOCUMENT"
                }));
                return;
            }

            var doc = app.activeDocument;

            function readLayers(layers) {

                var result = [];

                for (var i = 0; i < layers.length; i++) {

                    var layer = layers[i];

                    var item = {
                        name: layer.name,
                        selected: !!layer.selected
                    };

                    try {
                        if (layer.layers && layer.layers.length > 0) {
                            item.children = readLayers(layer.layers);
                        }
                    } catch (e) {
                    }

                    result.push(item);
                }

                return result;
            }

            var data = {
                document: doc.name,
                width: doc.width,
                height: doc.height,
                layers: readLayers(doc.layers)
            };

            app.echoToOE(JSON.stringify(data));

        })();
    `;

    window.parent.postMessage(
        script,
        "*"
    );
};


window.addEventListener("message", function (event) {

    console.log("MESSAGE DATA:", event.data);
    console.log("MESSAGE TYPE:", typeof event.data);

    var data = event.data;

    try {

        if (typeof data === "string") {
            data = JSON.parse(data);
        }

        status.textContent =
            "Received:\n\n" +
            JSON.stringify(data, null, 2);

    } catch (e) {

        status.textContent =
            "Received:\n\n" +
            String(event.data);

    }

});

</script>

</body>
</html>
